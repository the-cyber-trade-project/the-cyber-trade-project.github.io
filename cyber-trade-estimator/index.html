<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://the-cyber-trade-project.github.io/estimator/?src=legacy_redirect">
  <link rel="canonical" href="https://the-cyber-trade-project.github.io/estimator/">
  <title>Redirecting - The Cybersecurity Trade Project</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      background: #0ea5e9;
      color: #ffffff;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a.btn:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>The Cybersecurity Trade Project</h1>
    <p>The Career Estimator has moved to the official ecosystem location.</p>
    <a href="https://the-cyber-trade-project.github.io/estimator/?src=legacy_redirect" class="btn">Launch Career Estimator &rarr;</a>
  </div>
  <script>
    const target = "https://the-cyber-trade-project.github.io/estimator/?src=legacy_redirect" + window.location.hash;
    window.location.replace(target);
  </script>
</body>
</html>
